name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Project sites are served from /<repo>/. Scheduled runs carry no
      # github.event.repository, so the path comes from the runner's env.
      - run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITE_DISCORD_ID: ${{ vars.VITE_DISCORD_ID }}
      # Unknown paths get the app shell, so the router shows its 404 page.
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
